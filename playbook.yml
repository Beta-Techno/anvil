---
# Anvil provisioning playbook
#
# Tag groups:
#   core    - base system, security, docker, networking, config, secrets, cleanup
#   dev     - languages, build tools, dev tools, editors, AI agents, mani
#   desktop - GUI apps, terminals, fonts, flatpak/snap
#
# Profiles select tag combinations:
#   user:   [core, desktop]
#   dev:    [core, dev, desktop]
#   server: [core]

- hosts: localhost
  gather_facts: true
  become: false
  environment:
    DEBIAN_FRONTEND: noninteractive
  vars:
    ansible_python_interpreter: /usr/bin/python3
  roles:
    # Core system
    - { role: base, tags: [core], become: true }
    - { role: security, tags: [core], become: true }
    - { role: drivers, tags: [core], become: true }
    - { role: observability, tags: [core], become: true }

    # Docker
    - { role: docker, tags: [core], become: true }

    # Networking
    - { role: tailscale, tags: [core], become: true }

    # Git and dotfiles
    - { role: git_ssh, tags: [core] }
    - { role: chezmoi_install, tags: [core] }
    - { role: chezmoi_apply, tags: [core] }

    # Shell configuration
    - { role: shell_config, tags: [core] }

    # Build toolchain
    - { role: build_toolchain, tags: [dev], become: true }

    # Languages
    - { role: python, tags: [dev] }
    - { role: node, tags: [dev] }
    - { role: ruby, tags: [dev] }
    - { role: go, tags: [dev] }
    - { role: rust, tags: [dev] }
    - { role: dotnet, tags: [dev] }
    - { role: java, tags: [dev] }

    # Dev tools
    - { role: dev_tools, tags: [dev], become: true }

    # Secrets management
    - { role: lockbox, tags: [core] }
    - { role: mani, tags: [dev] }

    # AI agents
    - { role: claude_cli, tags: [dev] }
    - { role: codex, tags: [dev] }

    # Editor/IDE
    - { role: lazyvim, tags: [dev] }
    - { role: zed, tags: [dev] }
    - { role: cursor, tags: [dev] }
    - { role: jetbrains_toolbox, tags: [dev] }

    # Desktop environment
    - { role: flatpak_snap, tags: [desktop], become: true }
    - { role: fonts, tags: [desktop] }
    - { role: terminals, tags: [desktop], become: true }
    - { role: ghostty, tags: [desktop], become: true }
    - { role: chrome, tags: [desktop], become: true }
    - { role: docker_desktop, tags: [desktop], become: true }
    - { role: nomachine, tags: [desktop], become: true }
    - { role: terminal_extras, tags: [desktop], become: true }
    - { role: activitywatch, tags: [desktop] }
    - { role: flatpak_apps, tags: [desktop], become: true }
    - { role: snap_apps, tags: [desktop], become: true }

    # Cleanup
    - { role: cleanup, tags: [core], become: true }
