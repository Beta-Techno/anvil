---
# Anvil provisioning playbook
#
# Tag groups (functional, independently targetable):
#   system  - base packages, security, drivers, cleanup
#   infra   - docker, tailscale, observability, lockbox
#   config  - git, chezmoi, shell configuration
#   dev     - languages, build tools, dev tools, mani, AI agents, editors
#   desktop - GUI apps, terminals, fonts, flatpak/snap
#
# Profiles select tag combinations:
#   user:   [system, config, desktop]
#   dev:    [system, infra, config, dev, desktop]
#   server: [system, infra, config]
#
# Targeted re-runs:
#   anvil up --tags config    # re-apply dotfiles
#   anvil up --tags dev       # update languages/tools
#   anvil up --tags desktop   # fix GUI apps

- hosts: localhost
  gather_facts: true
  become: false
  environment:
    DEBIAN_FRONTEND: noninteractive
  vars:
    ansible_python_interpreter: /usr/bin/python3
  roles:
    # system — every machine, always
    - { role: base, tags: [system], become: true }
    - { role: security, tags: [system], become: true }
    - { role: drivers, tags: [system], become: true }

    # infra — infrastructure services
    - { role: docker, tags: [infra], become: true }
    - { role: tailscale, tags: [infra], become: true }
    - { role: observability, tags: [infra], become: true }
    - { role: lockbox, tags: [infra] }

    # config — identity and dotfiles
    - { role: git_ssh, tags: [config] }
    - { role: chezmoi_install, tags: [config] }
    - { role: chezmoi_apply, tags: [config] }
    - { role: shell_config, tags: [config] }

    # dev — languages, tools, editors
    - { role: build_toolchain, tags: [dev], become: true }
    - { role: python, tags: [dev] }
    - { role: node, tags: [dev] }
    - { role: ruby, tags: [dev] }
    - { role: go, tags: [dev] }
    - { role: rust, tags: [dev] }
    - { role: dotnet, tags: [dev] }
    - { role: java, tags: [dev] }
    - { role: dev_tools, tags: [dev], become: true }
    - { role: mani, tags: [dev] }
    - { role: claude_cli, tags: [dev] }
    - { role: codex, tags: [dev] }
    - { role: lazyvim, tags: [dev] }
    - { role: zed, tags: [dev] }
    - { role: cursor, tags: [dev] }
    - { role: jetbrains_toolbox, tags: [dev] }

    # desktop — GUI apps and environment
    - { role: flatpak_snap, tags: [desktop], become: true }
    - { role: fonts, tags: [desktop] }
    - { role: terminals, tags: [desktop], become: true }
    - { role: ghostty, tags: [desktop], become: true }
    - { role: chrome, tags: [desktop], become: true }
    - { role: docker_desktop, tags: [desktop], become: true }
    - { role: nomachine, tags: [desktop], become: true }
    - { role: terminal_extras, tags: [desktop], become: true }
    - { role: activitywatch, tags: [desktop] }
    - { role: flatpak_apps, tags: [desktop], become: true }
    - { role: snap_apps, tags: [desktop], become: true }

    # cleanup — always runs last
    - { role: cleanup, tags: [system], become: true }
