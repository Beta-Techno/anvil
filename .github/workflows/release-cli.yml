name: Release Anvil CLI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          go build -ldflags "-X main.version=${VERSION}" -o dist/anvil-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/anvil
          (cd dist && sha256sum anvil-${{ matrix.goos }}-${{ matrix.goarch }} > anvil-${{ matrix.goos }}-${{ matrix.goarch }}.sha256)

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/anvil-${{ matrix.goos }}-${{ matrix.goarch }}
            dist/anvil-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
