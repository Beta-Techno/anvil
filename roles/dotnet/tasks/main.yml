---
- name: Add Microsoft package repository GPG key
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/config/ubuntu/{{ ansible_distribution_version }}/packages-microsoft-prod.deb
    dest: /tmp/packages-microsoft-prod.deb
    mode: "0644"
  when: dotnet_install

- name: Install Microsoft package repository
  ansible.builtin.apt:
    deb: /tmp/packages-microsoft-prod.deb
  become: true
  when: dotnet_install

- name: Install .NET SDK
  ansible.builtin.apt:
    name: "dotnet-sdk-{{ dotnet_version }}"
    state: present
    update_cache: true
  become: true
  when: dotnet_install

- name: Install Entity Framework tool
  ansible.builtin.shell: |
    set -e
    dotnet tool install --global dotnet-ef
  args:
    executable: /bin/bash
    creates: "{{ ansible_env.HOME }}/.dotnet/tools/dotnet-ef"
  become: false
  when:
    - dotnet_install
    - dotnet_install_ef

- name: Create .NET shell configuration
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.config/shell/dotnet.sh"
    mode: "0644"
    content: |
      # .NET
      export PATH="$HOME/.dotnet/tools:$PATH"
      export DOTNET_CLI_TELEMETRY_OPTOUT=1
  become: false
  when: dotnet_install
