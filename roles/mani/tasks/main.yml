---
- name: Skip mani setup when disabled
  ansible.builtin.debug:
    msg: "Mani integration disabled (mani_install=false)."
  when: not mani_install

- name: Initialize mani manifest list
  ansible.builtin.set_fact:
    mani_manifest_list: >-
      {{ (mani_manifests | default([], true)) | to_yaml | from_yaml }}
  when: mani_install

- name: Load mani manifest list from env when unset
  ansible.builtin.set_fact:
    mani_manifest_list: >-
      {{ (lookup('env','MANI_MANIFESTS_JSON') | default('[]', true) | from_json) | to_yaml | from_yaml }}
  when:
    - mani_install
    - mani_manifest_list | length == 0

- name: Ensure mani manifest fallback
  ansible.builtin.set_fact:
    mani_manifest_list: >-
      {{ ([{
        'repo_url': mani_repo_url,
        'repo_path': mani_repo_path,
        'repo_ref': 'main',
        'sync_tags': mani_sync_tags,
        'run_commands': mani_run_commands
      }]) | to_yaml | from_yaml }}
  when:
    - mani_install
    - mani_manifest_list | length == 0

- name: Check mani binary
  ansible.builtin.stat:
    path: "{{ mani_bin_path }}"
  register: mani_bin_stat
  when: mani_install

- name: Ensure mani destination directory exists
  ansible.builtin.file:
    path: "{{ item.repo_path | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ mani_manifest_list }}"
  when: mani_install

- name: Ensure mani workspace directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ mani_workspace_dirs }}"
  when: mani_install

- name: Ensure mani extraction directory exists
  ansible.builtin.file:
    path: /tmp/mani-bin
    state: directory
    mode: "0755"
  when:
    - mani_install
    - not mani_bin_stat.stat.exists | default(false)

- name: Download mani release
  ansible.builtin.get_url:
    url: "https://github.com/alajmo/mani/releases/download/{{ mani_version }}/mani_{{ mani_version_number }}_linux_{{ mani_arch_map[apt_arch] | default(apt_arch) }}.tar.gz"
    dest: /tmp/mani.tar.gz
    mode: "0644"
  when:
    - mani_install
    - not mani_bin_stat.stat.exists | default(false)

- name: Extract mani binary
  ansible.builtin.unarchive:
    src: /tmp/mani.tar.gz
    dest: /tmp/mani-bin
    remote_src: true
    creates: /tmp/mani-bin/mani
  when:
    - mani_install
    - not mani_bin_stat.stat.exists | default(false)

- name: Install mani binary
  ansible.builtin.copy:
    src: /tmp/mani-bin/mani
    dest: "{{ mani_bin_path }}"
    mode: "0755"
  become: true
  when:
    - mani_install
    - not mani_bin_stat.stat.exists | default(false)

- name: Cleanup mani artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/mani.tar.gz
    - /tmp/mani-bin
  when:
    - mani_install
    - not mani_bin_stat.stat.exists | default(false)

- name: Ensure mani manifest repo present
  ansible.builtin.git:
    repo: "{{ item.repo_url }}"
    dest: "{{ item.repo_path }}"
    version: "{{ item.repo_ref | default('main') }}"
  loop: "{{ mani_manifest_list }}"
  loop_control:
    label: "{{ item.repo_url }}"
  when: mani_install

- name: Run mani sync
  ansible.builtin.command: >-
    {{ mani_bin_path }} --config {{ item.repo_path }}/mani.yaml sync --tags {{ (item.sync_tags | default(mani_sync_tags)) | join(',') }}
  loop: "{{ mani_manifest_list }}"
  loop_control:
    label: "{{ item.repo_url }}"
  environment: "{{ mani_env }}"
  when:
    - mani_install
    - (item.sync_tags | default(mani_sync_tags)) | length > 0

- name: Run mani commands
  ansible.builtin.command: >-
    {{ mani_bin_path }} --config {{ item.0.repo_path }}/mani.yaml run {{ item.1 }}
  loop: "{{ mani_manifest_list | subelements('run_commands', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.repo_url }} -> {{ item.1 }}"
  environment: "{{ mani_env }}"
  when:
    - mani_install
    - item.1 is truthy
