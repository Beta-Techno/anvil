# Default persona overrides for developer workstations
persona: dev

lockbox_render_targets:
  - project: anvil
    env: dev
    stack: bootstrap
    out: "{{ anvil_repo_path }}"
observability_install_node_exporter: false
observability_install_promtail: false
observability_install_osquery: false
observability_install_fleetctl: false
observability_install_netdata: false
activitywatch_install: false
